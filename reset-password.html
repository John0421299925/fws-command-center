<!DOCTYPE html>
<!--
  FWS Command Centre — Reset Password
  Version: v1.0

  Opened from the link emailed by /api/forgot-password. Reads
  username/token from the URL query string (never asks the person to
  type them), and lets them set a new password directly — no existing
  session required, since being locked out is the whole point of this
  flow. Posts to /api/reset-password.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Centre — Reset Password</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --error: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin: 0 0 20px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: default; }
  .msg {
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--ok); }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Reset Password</h1>
    <p class="sub" id="sub-text">Choose a new password below.</p>
    <form id="reset-form">
      <input type="password" id="new-password" placeholder="New password (min 8 characters)" autocomplete="new-password" autofocus />
      <input type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password" />
      <button type="submit" id="submit-btn">Reset password</button>
      <div class="msg error" id="error-msg"></div>
      <div class="msg success" id="success-msg"></div>
    </form>
    <a class="back-link" href="/login.html">← Back to login</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || '';
    const token = params.get('token') || '';

    const form = document.getElementById('reset-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');
    const subText = document.getElementById('sub-text');

    if (!username || !token) {
      subText.textContent = 'This link is missing some information — please use the exact link from your email.';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = 'New password and confirmation do not match.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting…';

      try {
        const resp = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, token, newPassword }),
        });
        const data = await resp.json();

        if (data.status === 'ok') {
          successMsg.textContent = data.message || 'Password reset — you can log in now.';
          successMsg.style.display = 'block';
          form.style.display = 'none';
        } else {
          errorMsg.textContent = data.error || 'Something went wrong — try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset password';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong — try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
