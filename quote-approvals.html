<!DOCTYPE html>
<!--
  FWS Command Centre — Quote Approvals
  Version: v1.7

  Lists quotation tickets ready for review (all SPs replied), and lets
  you open one to see the price comparison, pick a winner, and
  generate + file the client quote in one click. Calls this project's
  own proxy endpoints (quotes-pending.js, quote-comparison.js,
  approve-quote.js, send-quote-to-client.js), which in turn talk to
  the Auto Quotation Agent — the browser never calls that other
  Vercel project directly.

  v1.0 - Initial build.
  v1.1 - Fixed "Invalid Date" on the pending-quotes list: HubSpot
         returns hs_lastmodifieddate as an ISO date string, not epoch
         milliseconds, so fmtDate() was parsing it wrong.
  v1.2 - Added the same site-wide login check as index.html: redirects
         to /login.html if there's no valid session. Real protection
         is server-side (quotes-pending.js, quote-comparison.js and
         approve-quote.js all now check the session cookie themselves).
  v1.3 - Added the actual "Send to Client" step, appearing only after
         a successful quote generation. Deliberately its own separate,
         explicit action — pre-fills whatever client email was
         captured at intake (editable, since that data is often
         missing or wrong), and requires a second, explicit confirm
         click showing the exact recipient before anything is actually
         emailed to someone outside FWS. This is the one action on
         this whole page that can't be undone once clicked.
  v1.4 - Added a "Vs. this SP's recent quotes" column, showing the
         new prior_quotes data from get_comparison_data() — what this
         same SP has quoted for this same waste type elsewhere in the
         last 90 days, and how today's quote compares (% higher/lower/
         same). Helps catch a supplier quoting out of line with their
         own recent pattern, not just against the other SPs on this
         one job.
  v1.5 - Added a "Vs. recent realised cost" column, showing the new
         realised_cost data from get_comparison_data() — what's
         actually been paid to this SP for this waste type on real
         invoices in the last 90 days, across all clients. A second,
         independent reference point alongside recent quotes: one
         compares quote-to-quote, this one compares quote-to-actual-
         spend.
  v1.6 - Added a "Rate card" column, showing the standing p_services
         rate for this client + supplier + waste type, when one
         exists (only applicable to existing clients with an existing
         service on file — blank for new clients/sites, as expected).
         Third and final reference point alongside prior quotes and
         realised cost.
  v1.7 - "Vs. recent realised cost" now shows the container size it
         matched (e.g. "660L") alongside the invoice count, since
         realised_cost (shared_logic.py v3.10) now matches strictly on
         container size rather than blending sizes together — this
         makes it visible on-screen exactly what's being compared,
         not just correct behind the scenes.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quote Approvals — FWS Command Centre</title>
<style>
  :root {
    --ink: #1c1917;
    --ink-soft: #57534e;
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #e7e5e4;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --amber-border: #fcd34d;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --green: #15803d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  main {
    max-width: 840px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }

  .quote-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quote-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    cursor: pointer;
  }

  .quote-row:hover {
    border-color: var(--amber-border);
  }

  .quote-row .subject {
    font-weight: 500;
  }

  .quote-row .meta {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 2px;
  }

  .empty, .loading, .error {
    color: var(--ink-soft);
    padding: 24px 0;
  }

  .error {
    color: var(--red);
  }

  .detail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-top: 16px;
  }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .detail-header h2 {
    font-size: 17px;
    margin: 0;
  }

  .back-link {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
  }

  .back-link:hover {
    color: var(--ink);
  }

  .site-block {
    margin-top: 20px;
  }

  .site-block h3 {
    font-size: 14px;
    text-transform: none;
    color: var(--ink-soft);
    margin: 0 0 8px;
    font-weight: 600;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  th {
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 13px;
  }

  .warning-banner {
    background: var(--red-bg);
    color: var(--red);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    margin: 8px 0 0;
  }

  .approve-panel {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  select, button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  select {
    background: var(--surface);
    color: var(--ink);
  }

  button.approve-btn {
    background: var(--amber);
    color: #fff;
    border: none;
    font-weight: 500;
    cursor: pointer;
  }

  button.approve-btn:hover {
    background: #92400e;
  }

  button.approve-btn:disabled {
    background: #d6d3d1;
    cursor: not-allowed;
  }

  .result-panel {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 14px;
  }

  .result-panel.ok {
    background: #f0fdf4;
    color: var(--green);
    border: 1px solid #bbf7d0;
  }

  .result-panel.fail {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid #fecaca;
  }

  .result-panel ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }

  .missing-note {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 12px;
  }

  .send-panel {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .send-panel h4 {
    font-size: 14px;
    margin: 0 0 10px;
  }

  .send-panel input[type="email"], .send-panel textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  .send-panel textarea {
    min-height: 70px;
    resize: vertical;
  }

  .send-confirm-box {
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 14px;
  }

  .send-confirm-box .recipient {
    font-weight: 600;
  }

  .send-confirm-actions {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }

  button.confirm-send-btn {
    background: var(--amber);
    color: #fff;
    border: none;
  }

  button.confirm-send-btn:hover {
    background: #92400e;
  }

  button.cancel-send-btn {
    background: var(--surface);
    color: var(--ink);
  }
</style>
</head>
<body>

<header>
  <h1>Quote Approvals</h1>
  <p>Quotes with all supplier replies in, ready for review.</p>
</header>

<main>
  <div id="list-view">
    <div id="list-container" class="loading">Loading pending quotes…</div>
  </div>

  <div id="detail-view" style="display:none;"></div>
</main>

<script>
  // v1.2: check login before anything else runs.
  (async function checkAuth() {
    try {
      const resp = await fetch("/api/whoami");
      if (resp.status === 401) {
        window.location.href = "/login.html?next=" + encodeURIComponent(window.location.pathname);
      }
    } catch (err) {
      // let the page continue; individual calls will 401 safely
    }
  })();

  const listContainer = document.getElementById("list-container");
  let currentClientEmail = "";
  let currentClientName = "";
  const listView = document.getElementById("list-view");
  const detailView = document.getElementById("detail-view");

  function fmtMoney(n) {
    if (n === null || n === undefined) return "—";
    return "$" + Number(n).toFixed(2);
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
  }

  async function loadList() {
    listContainer.className = "loading";
    listContainer.textContent = "Loading pending quotes…";
    try {
      const resp = await fetch("/api/quotes-pending");
      const data = await resp.json();
      if (data.status !== "ok") throw new Error(data.error || "Unknown error");

      if (!data.quotes.length) {
        listContainer.className = "empty";
        listContainer.textContent = "No quotes are currently awaiting approval.";
        return;
      }

      listContainer.className = "quote-list";
      listContainer.innerHTML = "";
      data.quotes.forEach((q) => {
        const row = document.createElement("div");
        row.className = "quote-row";
        row.innerHTML = `
          <div class="subject">${q.subject}</div>
          <div class="meta">Updated ${fmtDate(q.last_modified)} · Ticket ${q.ticket_id}</div>
        `;
        row.onclick = () => openDetail(q.ticket_id);
        listContainer.appendChild(row);
      });
    } catch (err) {
      listContainer.className = "error";
      listContainer.textContent = "Couldn't load pending quotes: " + err.message;
    }
  }

  async function openDetail(ticketId) {
    listView.style.display = "none";
    detailView.style.display = "block";
    detailView.innerHTML = `<div class="loading">Loading comparison…</div>`;

    try {
      const resp = await fetch("/api/quote-comparison?ticket_id=" + encodeURIComponent(ticketId));
      const data = await resp.json();
      if (data.status !== "ok") throw new Error(data.error || "Unknown error");
      renderDetail(ticketId, data);
    } catch (err) {
      detailView.innerHTML = `
        <div class="back-link" onclick="closeDetail()">← Back to list</div>
        <div class="error">Couldn't load this quote: ${err.message}</div>
      `;
    }
  }

  function closeDetail() {
    detailView.style.display = "none";
    listView.style.display = "block";
    loadList();
  }

  function renderDetail(ticketId, data) {
    currentClientEmail = data.client_contact_email || "";
    currentClientName = data.client_name || "";

    const marginPct = data.margin_fraction != null ? (data.margin_fraction * 100).toFixed(0) + "%" : "not set";

    let sitesHtml = "";
    data.sites.forEach((site) => {
      let rows = "";
      site.waste_types.forEach((wt) => {
        wt.options.forEach((opt) => {
          let priorNote = "—";
          if (opt.prior_quotes) {
            const pq = opt.prior_quotes;
            const diffPct = opt.sp_price != null && pq.average_price
              ? Math.round(((opt.sp_price - pq.average_price) / pq.average_price) * 100)
              : null;
            const diffText = diffPct !== null
              ? (diffPct > 0 ? ` (${diffPct}% higher)` : diffPct < 0 ? ` (${Math.abs(diffPct)}% lower)` : " (same)")
              : "";
            priorNote = `${fmtMoney(pq.average_price)} avg${diffText} <span style="color:var(--ink-soft);font-size:12px;">(${pq.quote_count} quote${pq.quote_count === 1 ? "" : "s"}, ${pq.lookback_days}d)</span>`;
          }
          let realisedNote = "—";
          if (opt.realised_cost) {
            const rc = opt.realised_cost;
            const diffPct = opt.sp_price != null && rc.average_cost
              ? Math.round(((opt.sp_price - rc.average_cost) / rc.average_cost) * 100)
              : null;
            const diffText = diffPct !== null
              ? (diffPct > 0 ? ` (${diffPct}% higher)` : diffPct < 0 ? ` (${Math.abs(diffPct)}% lower)` : " (same)")
              : "";
            realisedNote = `${fmtMoney(rc.average_cost)} avg${diffText} <span style="color:var(--ink-soft);font-size:12px;">(${rc.invoice_count} invoice${rc.invoice_count === 1 ? "" : "s"}, ${rc.lookback_days}d${rc.container_size ? ", " + rc.container_size : ""})</span>`;
          }
          let rateCardNote = "—";
          if (opt.rate_card && opt.rate_card.rate_card_sp_cost != null) {
            const rcard = opt.rate_card;
            const diffPct = opt.sp_price != null
              ? Math.round(((opt.sp_price - rcard.rate_card_sp_cost) / rcard.rate_card_sp_cost) * 100)
              : null;
            const diffText = diffPct !== null
              ? (diffPct > 0 ? ` (${diffPct}% higher)` : diffPct < 0 ? ` (${Math.abs(diffPct)}% lower)` : " (same)")
              : "";
            rateCardNote = `${fmtMoney(rcard.rate_card_sp_cost)}${diffText} <span style="color:var(--ink-soft);font-size:12px;">(rate card)</span>`;
          }
          rows += `
            <tr>
              <td>${wt.waste_type}</td>
              <td>${opt.company}</td>
              <td>${opt.sp_price != null ? fmtMoney(opt.sp_price) + " " + (opt.unit || "") : (opt.raw_price ?? "—")}</td>
              <td>${opt.suggested_client_price != null ? fmtMoney(opt.suggested_client_price) : "—"}</td>
              <td>${priorNote}</td>
              <td>${realisedNote}</td>
              <td>${rateCardNote}</td>
            </tr>
          `;
        });
        if (wt.warning) {
          rows += `<tr><td colspan="7"><div class="warning-banner">${wt.warning}</div></td></tr>`;
        }
      });

      sitesHtml += `
        <div class="site-block">
          <h3>${site.site_label}${site.location ? " — " + site.location : ""}</h3>
          <table>
            <thead>
              <tr><th>Waste type</th><th>Supplier</th><th>Supplier price</th><th>Suggested client price</th><th>Vs. this SP's recent quotes</th><th>Vs. recent realised cost</th><th>Rate card</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    });

    const companyOptions = data.companies_replied
      .map((c) => `<option value="${c}">${c}</option>`)
      .join("");

    const missingNote = data.companies_missing.length
      ? `<div class="missing-note">Still waiting on: ${data.companies_missing.join(", ")} — you can still approve using whoever has already replied.</div>`
      : "";

    detailView.innerHTML = `
      <div class="back-link" onclick="closeDetail()">← Back to list</div>
      <div class="detail">
        <div class="detail-header">
          <h2>${data.client_name || "(client name not provided)"}</h2>
          <span>Margin: ${marginPct}</span>
        </div>
        ${sitesHtml}
        ${missingNote}
        <div class="approve-panel">
          <label for="company-select">Approve using:</label>
          <select id="company-select">${companyOptions}</select>
          <button class="approve-btn" id="approve-btn">Generate quote</button>
        </div>
        <div id="result-panel"></div>
        <div id="send-panel"></div>
      </div>
    `;

    document.getElementById("approve-btn").onclick = () => approveQuote(ticketId);
  }

  async function approveQuote(ticketId) {
    const btn = document.getElementById("approve-btn");
    const company = document.getElementById("company-select").value;
    const resultPanel = document.getElementById("result-panel");

    btn.disabled = true;
    btn.textContent = "Generating…";
    resultPanel.innerHTML = "";

    try {
      const resp = await fetch("/api/approve-quote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticket_id: ticketId, company }),
      });
      const data = await resp.json();

      if (data.status !== "ok") throw new Error(data.error || "Unknown error");

      const blobLines = (data.blob_results || [])
        .map((b) => `<li>${b.file}: ${b.status}${b.error ? " — " + b.error : ""}</li>`)
        .join("");
      const hsLines = (data.hubspot_attachment_results || [])
        .map((h) => `<li>${h.file}: ${h.status}${h.error ? " — " + h.error : ""}</li>`)
        .join("");

      resultPanel.className = "result-panel ok";
      resultPanel.innerHTML = `
        Quote generated using ${data.chosen_company}'s pricing (margin: ${data.margin_used}).
        Emailed to James/John for review.
        <ul>${blobLines}${hsLines}</ul>
      `;
      btn.textContent = "Generate quote";
      btn.disabled = false;

      renderSendPanel(ticketId, data.chosen_company);
    } catch (err) {
      resultPanel.className = "result-panel fail";
      resultPanel.textContent = "Couldn't generate the quote: " + err.message;
      btn.textContent = "Generate quote";
      btn.disabled = false;
    }
  }

  function renderSendPanel(ticketId, chosenCompany) {
    const panel = document.getElementById("send-panel");
    panel.innerHTML = `
      <div class="send-panel">
        <h4>Send to Client</h4>
        <input type="email" id="client-email-input" placeholder="Client email address" value="${currentClientEmail}" />
        <textarea id="custom-message-input" placeholder="Optional message to include (leave blank to use the standard message)"></textarea>
        <button class="approve-btn" id="send-to-client-btn">Send to Client</button>
        <div id="send-confirm-area"></div>
      </div>
    `;
    document.getElementById("send-to-client-btn").onclick = () => requestSendConfirm(ticketId, chosenCompany);
  }

  function requestSendConfirm(ticketId, chosenCompany) {
    const email = document.getElementById("client-email-input").value.trim();
    const confirmArea = document.getElementById("send-confirm-area");

    if (!email) {
      confirmArea.innerHTML = `<div class="result-panel fail">Enter a client email address first.</div>`;
      return;
    }

    confirmArea.innerHTML = `
      <div class="send-confirm-box">
        This will email the quote to <span class="recipient">${email}</span> right now — this can't be undone.
        <div class="send-confirm-actions">
          <button class="confirm-send-btn" id="confirm-send-btn">Yes, send it</button>
          <button class="cancel-send-btn" id="cancel-send-btn">Cancel</button>
        </div>
      </div>
    `;
    document.getElementById("confirm-send-btn").onclick = () => confirmSend(ticketId, chosenCompany, email);
    document.getElementById("cancel-send-btn").onclick = () => { confirmArea.innerHTML = ""; };
  }

  async function confirmSend(ticketId, chosenCompany, email) {
    const confirmArea = document.getElementById("send-confirm-area");
    const customMessage = document.getElementById("custom-message-input").value.trim();
    const sendBtn = document.getElementById("send-to-client-btn");

    confirmArea.innerHTML = `<div class="result-panel">Sending…</div>`;
    sendBtn.disabled = true;

    try {
      const resp = await fetch("/api/send-quote-to-client", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ticket_id: ticketId,
          company: chosenCompany,
          client_email: email,
          custom_message: customMessage || null,
        }),
      });
      const data = await resp.json();

      if (data.status !== "ok") throw new Error(data.error || "Unknown error");

      confirmArea.innerHTML = `<div class="result-panel ok">Sent to ${data.sent_to} (James and John CC'd).</div>`;
      sendBtn.style.display = "none";
    } catch (err) {
      confirmArea.innerHTML = `<div class="result-panel fail">Couldn't send: ${err.message}</div>`;
      sendBtn.disabled = false;
    }
  }

  loadList();
</script>

</body>
</html>
