<!DOCTYPE html>
<!--
  FWS Command Centre — Login
  Version: v1.1

  Single password gate for the whole Command Centre (pages and APIs).
  Posts to /api/login, which sets a session cookie on success and
  redirects back to wherever the person was trying to go.

  v1.1 - The error message shown on failure was hardcoded to
         "Incorrect password" regardless of what actually went wrong
         (e.g. CC_PASSWORD not configured on this environment would
         look identical to a genuine wrong password). Now shows the
         real error text the server returned.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Centre — Login</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    width: 100%;
    max-width: 320px;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 20px;
    text-align: center;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: default; }
  .error-msg {
    color: var(--error);
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>FWS Command Centre</h1>
    <form id="login-form">
      <input type="password" id="password" placeholder="Password" autofocus />
      <button type="submit" id="submit-btn">Log in</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await resp.json();

        if (data.status === 'ok') {
          window.location.href = next;
        } else {
          errorMsg.textContent = data.error || 'Login failed — try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log in';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong — try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
