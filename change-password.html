<!DOCTYPE html>
<!--
  FWS Command Centre — Change Password
  Version: v1.0

  Lets a logged-in person set their own password, replacing the
  shared temporary one everyone was given at launch. Requires their
  current password plus a new one, twice. Posts to
  /api/change-password, which writes the change straight back to
  Vercel's live CC_USERS value (see lib/auth.js v2.0) — the new
  password works on the very next login attempt.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Centre — Change Password</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --error: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin: 0 0 20px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: default; }
  .msg {
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--ok); }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Change Password</h1>
    <p class="sub">Replace your temporary password with your own.</p>
    <form id="change-form">
      <input type="password" id="current-password" placeholder="Current password" autocomplete="current-password" autofocus />
      <input type="password" id="new-password" placeholder="New password (min 8 characters)" autocomplete="new-password" />
      <input type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password" />
      <button type="submit" id="submit-btn">Change password</button>
      <div class="msg error" id="error-msg"></div>
      <div class="msg success" id="success-msg"></div>
    </form>
    <a class="back-link" href="/">← Back to dashboard</a>
  </div>

  <script>
    const form = document.getElementById('change-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      const currentPassword = document.getElementById('current-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = 'New password and confirmation do not match.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Changing…';

      try {
        const resp = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword }),
        });
        const data = await resp.json();

        if (data.status === 'ok') {
          successMsg.textContent = 'Password changed — use it next time you log in.';
          successMsg.style.display = 'block';
          form.reset();
        } else {
          errorMsg.textContent = data.error || 'Something went wrong — try again.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong — try again.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Change password';
      }
    });
  </script>
</body>
</html>
