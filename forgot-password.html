<!DOCTYPE html>
<!--
  FWS Command Centre — Forgot Password
  Version: v1.0

  Asks only for a username, posts to /api/forgot-password. Always
  shows the same generic confirmation message regardless of whether
  the username was real — see forgot-password.js's own header note
  for why that's deliberate, not an oversight.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Centre — Forgot Password</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --error: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    width: 100%;
    max-width: 320px;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin: 0 0 20px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: default; }
  .msg {
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--ok); }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Forgot Password</h1>
    <p class="sub">Enter your username and we'll email you a reset link.</p>
    <form id="forgot-form">
      <input type="text" id="username" placeholder="Username" autofocus autocomplete="username" />
      <button type="submit" id="submit-btn">Send reset link</button>
      <div class="msg error" id="error-msg"></div>
      <div class="msg success" id="success-msg"></div>
    </form>
    <a class="back-link" href="/login.html">← Back to login</a>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        const resp = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value }),
        });
        const data = await resp.json();

        successMsg.textContent = data.message || 'If that username exists, a reset link has been sent.';
        successMsg.style.display = 'block';
        form.reset();
      } catch (err) {
        errorMsg.textContent = 'Something went wrong — try again.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
